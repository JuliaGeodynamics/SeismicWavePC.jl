name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.group }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # the tests in groups (test/runtests.jl), as parallel jobs; Julia 1 on all systems, the LTS 1.10 on Linux
      matrix:
        version: ['1']
        os: [ubuntu-latest, macos-latest, windows-latest]
        group: [mpi1, mpi2, mpi3, gradient, curvilinear, other]
        exclude:                        # (no MPI tests on Windows)
          - {os: windows-latest, group: mpi1}
          - {os: windows-latest, group: mpi3}
        include:
          - {version: '1.10', os: ubuntu-latest, group: mpi1}
          - {version: '1.10', os: ubuntu-latest, group: mpi2}
          - {version: '1.10', os: ubuntu-latest, group: mpi3}
          - {version: '1.10', os: ubuntu-latest, group: gradient}
          - {version: '1.10', os: ubuntu-latest, group: curvilinear}
          - {version: '1.10', os: ubuntu-latest, group: other}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
        with:                           # (one cache per system and Julia version, shared by the groups)
          cache-name: julia-cache-${{ matrix.os }}-${{ matrix.version }}
          include-matrix: false
      - name: Swap file (Linux runners have 16 GB; the MPI test runs 4 Julia processes of ~3 GB each)
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a
          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false               # not uploaded; code coverage makes the tests (Enzyme) several times slower
        env:
          JULIA_NUM_THREADS: 2
          SWPC_TEST_GROUP: ${{ matrix.group }}
